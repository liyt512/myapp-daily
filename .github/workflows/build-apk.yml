name: 构建APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 接受Android SDK许可证
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true

    - name: 安装Android SDK组件
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || true

    - name: 配置Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: 构建APK
      run: gradle assembleDebug

    - name: 上传APK到GitHub
      uses: actions/upload-artifact@v4
      with:
        name: myapp-daily.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: 发布Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.${{ github.run_number }}
        name: 我的日常 v1.1.${{ github.run_number }}
        body: |
          ✅ 修复图标白边
          ✅ 支持文件选择（头像/图片/视频）
          ✅ 头像裁剪缩放功能
          ✅ 发图片/视频功能
        files: app/build/outputs/apk/debug/app-debug.apk
        fail_on_unmatched_files: false
        make_latest: true
        token: ${{ github.token }}
      env:
        GITHUB_TOKEN: ${{ github.token }}