name: 构建APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 接受Android SDK许可证
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true

    - name: 安装Android SDK组件
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || true

    - name: 配置Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: 构建APK
      run: gradle assembleDebug

    - name: 上传APK到GitHub
      uses: actions/upload-artifact@v4
      with:
        name: myapp-daily.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: 部署APK到服务器
      if: env.SERVER_HOST != ''
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASS }}
        port: 22
        source: "app/build/outputs/apk/debug/app-debug.apk"
        target: /tmp
        strip_components: 5
        overwrite: true
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}  # 无值时跳过此步骤

    - name: 移动APK到网站目录
      if: env.SERVER_HOST != ''
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASS }}
        port: 22
        script: |
          mkdir -p /root/uploads && cp /tmp/app-debug.apk /root/app.apk 2>/dev/null || true
          ls -lh /root/app.apk 2>/dev/null || echo "服务器部署跳过"
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}