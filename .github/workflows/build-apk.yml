name: 构建APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 设置Android SDK
      run: |
        # 查找Android SDK路径
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "ANDROID_HOME not found"
        ls -la $ANDROID_SDK_ROOT/ 2>/dev/null || echo "ANDROID_SDK_ROOT not found"
        # 尝试查找sdkmanager
        find / -name "sdkmanager" -type f 2>/dev/null | head -5 || echo "sdkmanager not found"

    - name: 设置Android SDK (方式2)
      uses: android-actions/setup-android@v3

    - name: 接受许可证并安装SDK组件
      run: |
        # 接受许可证
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
        # 安装所需组件
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 || true

    - name: 赋予Gradle权限
      run: chmod +x gradlew

    - name: 构建APK
      run: ./gradlew assembleDebug

    - name: 上传APK
      uses: actions/upload-artifact@v4
      with:
        name: myapp-daily.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error